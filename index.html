<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Currency Converter</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>Currency Converter</h1>
		<form>
			<div class = "amount">
				<p> Enter Amount</p>
				<input id="amount" name="amount" type="number" min="0" step="any" value="1">
			</div>

			<div class="dropdown">
				<div class="from">
					<p>From</p>

					<div class= "select-container">
						<img src="https://flagsapi.com/US/flat/64.png" alt="US Flag">
						<select name="from" id="from">

							<option value="USD">USD</option>
							<option value="EUR">EUR</option>
							<option value="NEP">NEP</option>
							<option value="JPY">JPY</option>
							<option value="INR">INR</option>
						</select>
					</div>
				</div>

				<div class="to">
					<p>To</p>

					<div class= "select-container">
						<img src="https://flagsapi.com/NP/flat/64.png" alt="Nepal Flag">
						<select name="to" id="to">

							<option value="USD">USD</option>
							<option value="EUR">EUR</option>
							<option value="NEP" selected>NEP</option>
							<option value="JPY">JPY</option>
							<option value="NPR">NPR</option>
						</select>
					</div>
				</div>
			</div>

			<div class="msg"> 1 USD = 152.00 NPR</div>
			<button>Get Exchange Rate</button>
		</form>
	</div>

	
	<script src="script.js"></script>
</body>
</html>
